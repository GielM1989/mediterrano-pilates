<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;src:url(fraunces-normal.woff2) format("woff2")}
@font-face{font-family:Inter;src:url(inter.woff2) format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:2256px;height:382px;overflow:hidden;background:#2E4034;font-family:Inter,sans-serif;color:#F5EEE0;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 500px at 92% 50%, rgba(208,106,63,.28), transparent 70%),
 radial-gradient(700px 400px at 20% 120%, rgba(224,162,78,.14), transparent 70%),
 #2E4034}
.rule{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#D06A3F,#E0A24E)}
.text{position:absolute;left:610px;top:0;height:374px;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:1060px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:66px;line-height:1.08;letter-spacing:-.01em;color:#F5EEE0}
h1 em{font-style:italic;color:#E9B48A}
.sub{font-size:24px;line-height:1.35;color:#D9D3C2;font-weight:400}
.sub b{color:#F5EEE0;font-weight:500}
.chips{display:flex;gap:14px;margin-top:4px}
.chip{border:1.5px solid rgba(245,238,224,.35);border-radius:999px;padding:8px 20px;font-size:21px;color:#F5EEE0;letter-spacing:.01em}
.prods{position:absolute;right:70px;top:46px;display:flex;gap:22px}
.prods img{width:290px;height:290px;object-fit:cover;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.35);border:3px solid rgba(245,238,224,.18)}
.prods img:nth-child(2){transform:translateY(-14px)}
.url{position:absolute;right:80px;bottom:26px;font-size:20px;color:#D9D3C2;letter-spacing:.04em}
</style></head><body>
<div class="bg"></div>
<div class="text">
  <h1>Merchandise with your logo<br>for <em>Pilates</em> and <em>yoga</em> studios</h1>
  <div class="sub">Grip socks, tumblers, tote bags and Pilates rings.<br><b>Logo woven or embroidered, never printed.</b></div>
  <div class="chips"><span class="chip">Free mockup in 24 h</span><span class="chip">From 50 pairs</span><span class="chip">Free worldwide shipping</span></div>
</div>
<div class="prods"><img src="product-sokken.jpg"><img src="product-tumbler.jpg"></div>
<div class="url">mediterranopilates.com</div>
<div class="rule"></div>
</body></html>
