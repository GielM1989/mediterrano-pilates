[build]
  publish = "site"
  command = ""
  # Alleen bouwen/publiceren als de site zelf of deze config verandert.
  # Commits met alleen docs/, notities of rapporten kosten zo geen deploy-credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Internationale bio-link: mediterranopilates.com/free-design
# Stuurt naar het mockupformulier onderaan de homepage in de taal van de browser (standaard Spaans), met UTM-tracking.

[[redirects]]
  from = "/free-design"
  to = "/en/?utm_source=instagram&utm_medium=bio&utm_campaign=profile#mockup-form"
  status = 302
  force = true
  conditions = {Language = ["en"]}

[[redirects]]
  from = "/free-design"
  to = "/de/?utm_source=instagram&utm_medium=bio&utm_campaign=profile#mockup-form"
  status = 302
  force = true
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/free-design"
  to = "/nl/?utm_source=instagram&utm_medium=bio&utm_campaign=profile#mockup-form"
  status = 302
  force = true
  conditions = {Language = ["nl"]}

[[redirects]]
  from = "/free-design"
  to = "/fr/?utm_source=instagram&utm_medium=bio&utm_campaign=profile#mockup-form"
  status = 302
  force = true
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/free-design"
  to = "/?utm_source=instagram&utm_medium=bio&utm_campaign=profile#mockup-form"
  status = 302
  force = true

# Oude bio-link blijft werken
[[redirects]]
  from = "/tu-boceto-gratis"
  to = "/free-design"
  status = 301
  force = true

# Korte, nette link voor de Instagram-bio (ES-account). Toont als
# "mediterranopilates.com/tu-mockup" en stuurt door naar de ES-homepage met UTM-tracking.
[[redirects]]
  from = "/tu-mockup"
  to = "/?utm_source=instagram&utm_medium=bio&utm_campaign=profile"
  status = 301
  force = true

