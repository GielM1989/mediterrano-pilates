[build]
  publish = "site"
  command = ""
  # Alleen bouwen/publiceren als de site zelf of deze config verandert.
  # Commits met alleen docs/, notities of rapporten kosten zo geen deploy-credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Korte, nette link voor de Instagram-bio (ES-account). Toont als
# "mediterranopilates.com/tu-mockup" en stuurt door naar de ES-homepage met UTM-tracking.
[[redirects]]
  from = "/tu-mockup"
  to = "/?utm_source=instagram&utm_medium=bio&utm_campaign=profile"
  status = 301
  force = true
