<!DOCTYPE html>
<html>
<head><title>Netlify Forms detection</title></head>
<body>
<!-- Formulario oculto para que Netlify registre el formulario al desplegar -->
<form name="mockup-aanvraag" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="nombre" />
  <input type="email" name="email" />
  <input type="text" name="estudio" />
  <input type="checkbox" name="producto" value="Calcetines antideslizantes" />
  <textarea name="bericht"></textarea>
  <input type="text" name="instagram" />
  <input type="tel" name="telefono" />
  <input type="text" name="color_calcetin" />
  <input type="text" name="color_otro" />
  <input type="text" name="tecnica_logo" />
  <input type="text" name="cantidad" />
  <input type="text" name="pais_ciudad" />
  <input type="file" name="logo" />
  <input type="text" name="productos_elegidos" />
  <input type="hidden" name="lead_id" />
  <input type="hidden" name="referrer" />
  <input type="hidden" name="landing_page" />
  <input type="hidden" name="language" />
  <input type="hidden" name="utm_content" />
  <input type="hidden" name="utm_term" />
  <input type="hidden" name="utm_source" />
  <input type="hidden" name="utm_medium" />
  <input type="hidden" name="utm_campaign" />
  <input name="bot-field" />
</form>
</body>
</html>
