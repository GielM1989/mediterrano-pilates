<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Mediterrano Pilates</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/favicon.svg">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/inter.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/fraunces-normal.woff2') format('woff2')}
</style>
<style>
:root{
  --green:#2E4034; --terra:#D06A3F; --terra-2:#B85C36;
  --cream:#F5EEE0; --white:#FFFDF8; --ink:#22261F; --line:#E4DBC8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--green);padding:18px 0}
.wrap{max-width:640px;margin:0 auto;padding:0 24px}
.brand img{display:block;height:30px;width:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.card{max-width:520px}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-2)}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(1.8rem,5vw,2.6rem);margin:14px 0 12px}
p{color:#4c554d;margin-bottom:28px}
.btn{display:inline-block;background:var(--terra-2);color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;box-shadow:0 12px 28px -10px rgba(200,106,74,.6)}
.btn:hover{background:var(--terra-2)}
.langs{margin-top:28px;font-size:.9rem;color:#666E67}
.langs a{color:var(--green);font-weight:700;text-decoration:none;margin:0 6px}
.langs a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Mediterrano Pilates"><img src="images/logo-mediterrano-light.svg" alt="Mediterrano Pilates" width="1000" height="377"></a>
  </div>
</div>

<main>
  <div class="card">
    <span class="kicker">Error 404</span>
    <h1>Esta página no existe o se ha movido.</h1>
    <p>Puede que el enlace esté roto o que la página se haya trasladado. Vuelve al inicio o solicita tu mockup gratis.</p>
    <a class="btn" href="/">Volver al inicio</a>
    <div class="langs">
      <a href="/">Español</a>·<a href="/en/">English</a>·<a href="/de/">Deutsch</a>
    </div>
  </div>
</main>

</body>
</html>
