name: IndexNow

# Na elke wijziging aan de site op main: wacht tot Netlify live staat en meld de gewijzigde
# pagina's bij IndexNow (Bing en daarmee ChatGPT/Copilot, plus Yandex, Seznam, Naver).
# Handmatig starten (Actions > IndexNow > Run workflow) meldt alle URL's uit de sitemap.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wachten tot Netlify de nieuwe versie live heeft
        run: |
          # Netlify publiceert meestal binnen 1-2 minuten; daarna controleren we of de sleutel bereikbaar is.
          sleep 150
          for i in $(seq 1 20); do
            if curl -fsS https://mediterranopilates.com/2c71ed55357f6c58aa0102ea6ac34f3e.txt | grep -q 2c71ed55357f6c58aa0102ea6ac34f3e; then echo "site bereikbaar"; exit 0; fi
            sleep 15
          done
          echo "sleutelbestand niet bereikbaar"; exit 1
      - name: Gewijzigde pagina's melden
        if: github.event_name == 'push'
        run: python3 scripts/indexnow.py --diff "${{ github.event.before }}" "${{ github.sha }}"
      - name: Alle pagina's melden (handmatig gestart)
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/indexnow.py --all
